<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Noto Sans, Segoe UI, Helvetica, Arial, sans-serif" fill="#24292F">
  <title>Cómo se calcula el cash disponible</title>
  <desc>Una consulta lee las órdenes del usuario en la tabla orders. Las órdenes FILLED dan el saldo: CASH_IN − CASH_OUT (size) + SELL − BUY (size × price). Las órdenes NEW BUY (LIMIT) dan lo reservado: la suma de size × price. REJECTED, CANCELLED y NEW SELL no mueven cash. Disponible = saldo − reservado; en el seed, usuario 1: 753.000,00 − 125.500,00 = 627.500,00. decide() usa el disponible para una BUY y el portfolio lo muestra.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#424A53"/>
    </marker>
  </defs>

  <!-- Card: white canvas with rounded corners, so it reads as a card on a dark page -->
  <rect x="0" y="0" width="900" height="460" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="458" rx="15" fill="none" stroke="#D0D7DE" stroke-width="2"/>

  <text x="40" y="42" font-size="22" font-weight="700">Cómo se calcula el cash disponible</text>
  <text x="40" y="66" font-size="14" fill="#57606A">Nada se guarda dos veces: cada lectura suma las órdenes del usuario, en una consulta.</text>

  <!-- Data store: orders -->
  <g stroke="#57606A" stroke-width="2">
    <path d="M40,206 v104 a70,14 0 0 0 140,0 v-104" fill="#ffffff"/>
    <ellipse cx="110" cy="206" rx="70" ry="14" fill="#ffffff"/>
  </g>
  <text x="110" y="254" font-size="17" font-weight="700" text-anchor="middle">orders</text>
  <text x="110" y="276" font-size="13" text-anchor="middle" fill="#424A53">del usuario</text>
  <text x="110" y="296" font-size="12" text-anchor="middle" fill="#6639BA">WHERE userid = $1</text>

  <!-- Filters: green boxes for the two sums, gray box for orders that do not move cash -->
  <rect x="280" y="96" width="290" height="104" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="280" y="220" width="290" height="80" rx="14" fill="#FFF8E1" stroke="#B26A00" stroke-width="2"/>
  <rect x="280" y="320" width="290" height="96" rx="14" fill="#F6F8FA" stroke="#8C959F" stroke-width="2" stroke-dasharray="6 5"/>

  <g text-anchor="middle">
    <text x="425" y="124" font-size="16" font-weight="600">saldo · órdenes FILLED</text>
    <text x="425" y="152" font-size="14">+ CASH_IN − CASH_OUT   (size)</text>
    <text x="425" y="178" font-size="14">+ SELL − BUY   (size × price)</text>

    <text x="425" y="248" font-size="16" font-weight="600">reservado · NEW BUY (LIMIT)</text>
    <text x="425" y="276" font-size="14">Σ size × price · cancelar lo libera</text>

    <text x="425" y="346" font-size="16" font-weight="600" fill="#57606A">no mueven cash</text>
    <text x="425" y="372" font-size="13" fill="#424A53">REJECTED · CANCELLED · NEW SELL</text>
    <text x="425" y="394" font-size="12" fill="#57606A">(NEW SELL reserva acciones, no cash)</text>
  </g>

  <!-- Result -->
  <rect x="620" y="96" width="260" height="204" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
  <g text-anchor="middle">
    <text x="750" y="140" font-size="20" font-weight="700">disponible</text>
    <text x="750" y="166" font-size="15" font-weight="600">= saldo − reservado</text>
    <line x1="644" y1="186" x2="856" y2="186" stroke="#A5D6A7" stroke-width="1.5"/>
    <text x="750" y="212" font-size="12" fill="#57606A">seed, usuario 1</text>
    <text x="750" y="234" font-size="14">753.000,00</text>
    <text x="750" y="254" font-size="14">− 125.500,00</text>
    <text x="750" y="278" font-size="14" font-weight="700">= 627.500,00</text>
  </g>

  <!-- Consumers -->
  <rect x="620" y="336" width="260" height="92" rx="14" fill="#DDF4FF" stroke="#0969DA" stroke-width="2"/>
  <text x="638" y="360" font-size="13" font-weight="600">Lo usan</text>
  <text x="638" y="380" font-size="12" fill="#424A53">decide(): una BUY que lo supera</text>
  <text x="638" y="397" font-size="12" fill="#424A53">es REJECTED INSUFFICIENT_FUNDS</text>
  <text x="638" y="414" font-size="12" fill="#424A53">GET …/portfolio: cash.available</text>

  <!-- Connectors -->
  <g stroke="#424A53" stroke-width="2" fill="none">
    <path d="M180,260 H230"/>
  </g>
  <g stroke="#424A53" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M230,260 V148 H278"/>
    <path d="M230,260 H278"/>
    <path d="M230,260 V368 H278"/>
    <path d="M570,148 H618"/>
    <path d="M570,260 H618"/>
    <path d="M750,300 V334"/>
  </g>
</svg>
