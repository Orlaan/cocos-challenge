name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify # lint + format check + typecheck + unit + e2e (Testcontainers uses the runner's Docker)

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait # --wait: db healthy, api container running
      # The API needs a moment to listen after start, so the first request retries.
      - run: curl --fail --silent --retry 30 --retry-delay 1 --retry-all-errors "http://localhost:3000/instruments?q=GGAL" | grep '"ticker":"GGAL"'
      - run: curl --fail --silent http://localhost:3000/users/1/portfolio | grep '"userId":1'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
