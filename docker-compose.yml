# docker compose up → Postgres seeded with db/database.sql (+ db/local-additions.sql: idempotency keys, audit log) and the API on :3000.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cocos
    ports: ["5432:5432"]
    volumes:
      - ./db/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - ./db/local-additions.sql:/docker-entrypoint-initdb.d/02-local-additions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cocos"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cocos
      PORT: "3000"
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/instruments?q=a').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 1s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
